name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run download, to fetch the latest data-refresh cache below
    defaults:
      run:
        working-directory: f1-race-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: f1-race-analytics/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt ruff

      - name: Lint
        run: ruff check backend/

      # backend/tests/*.py run against the real local cache by project
      # convention (see their docstrings), not mocked fixtures -- but none
      # of them touch Azure/the LLM (only backend/llm/client.py constructs
      # an AzureOpenAI client, and nothing here imports it). Grab the latest
      # cache built by the scheduled data-refresh workflow if one exists,
      # unauthenticated OpenF1 calls only from here on.
      - name: Restore F1 data cache from the last data-refresh run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=data-refresh.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name cache-sqlite --dir backend/storage
          else
            echo "No previous data-refresh run found -- populating from scratch."
          fi

      - name: Populate any test data still missing
        run: python -m backend.data.ingest --years 2024 --session-types Race Qualifying

      - name: Run backend test suite
        run: |
          python -m backend.tests.test_cache
          python -m backend.tests.test_openf1_client
          python -m backend.tests.test_features
          python -m backend.tests.test_summary
          python -m backend.tests.test_tools
        # test_model.py is deliberately excluded: it has a pre-existing,
        # unrelated failure (dropout stays active during a train()-mode-only
        # overfit check that never calls .eval()) -- flagged, not fixed here.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1-race-analytics/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: f1-race-analytics/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
