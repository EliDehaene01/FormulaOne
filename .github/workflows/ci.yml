name: CI

on:
  push:
  pull_request:

jobs:
  # Job-level path filtering isn't a native GitHub Actions feature (only
  # workflow-level `on.push.paths` is) -- this job + dorny/paths-filter is
  # the standard way to gate just ONE job in a shared workflow on specific
  # paths, so backend/frontend above still run on every push as before.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # real Azure creds below -- pushes to this repo only, never a fork's pull_request
    outputs:
      llm: ${{ steps.filter.outputs.llm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            llm:
              - 'f1-race-analytics/backend/llm/**'
              - 'f1-race-analytics/backend/rag/**'
              - 'f1-race-analytics/backend/knowledge_base/**'
              - 'f1-race-analytics/evals/**'

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run download, to fetch the latest data-refresh cache below
    defaults:
      run:
        working-directory: f1-race-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: f1-race-analytics/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt ruff

      - name: Lint
        run: ruff check backend/

      # backend/tests/*.py run against the real local cache by project
      # convention (see their docstrings), not mocked fixtures -- but none
      # of them touch Azure/the LLM (only backend/llm/client.py constructs
      # an AzureOpenAI client, and nothing here imports it). Grab the latest
      # cache built by the scheduled data-refresh workflow if one exists,
      # unauthenticated OpenF1 calls only from here on.
      - name: Restore F1 data cache from the last data-refresh run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=data-refresh.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name cache-sqlite --dir backend/storage
          else
            echo "No previous data-refresh run found -- populating from scratch."
          fi

      - name: Populate any test data still missing
        run: python -m backend.data.ingest --years 2024 --session-types Race Qualifying

      - name: Run backend test suite
        run: |
          python -m backend.tests.test_cache
          python -m backend.tests.test_openf1_client
          python -m backend.tests.test_features
          python -m backend.tests.test_summary
          python -m backend.tests.test_tools
        # test_model.py is deliberately excluded: it has a pre-existing,
        # unrelated failure (dropout stays active during a train()-mode-only
        # overfit check that never calls .eval()) -- flagged, not fixed here.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1-race-analytics/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: f1-race-analytics/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Actually runs the eval suite (evals/run_evaluation.py) against the real
  # chat loop, so -- unlike backend/frontend above -- this one DOES need
  # real Azure credentials. Only runs when the `changes` job above found
  # something relevant, and only from `push` (see that job's `if`), so it
  # never fires on a fork's pull_request, where secrets aren't available.
  eval-docs:
    needs: changes
    if: needs.changes.outputs.llm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit docs/EVAL_RESULTS.md back
      actions: read # gh run download, to restore F1 data for the eval test cases
    defaults:
      run:
        working-directory: f1-race-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: f1-race-analytics/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Same reasoning as the backend job: some eval test cases go through
      # real tool calls (get_qualifying_prediction, race-data questions),
      # which need the real cache populated.
      - name: Restore F1 data cache from the last data-refresh run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=data-refresh.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name cache-sqlite --dir backend/storage
          else
            echo "No previous data-refresh run found -- populating from scratch."
          fi

      - name: Populate any test data still missing
        run: python -m backend.data.ingest --years 2024 --session-types Race Qualifying

      - name: Run the eval suite
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: python -m evals.run_evaluation

      - name: Commit updated eval results doc, if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/EVAL_RESULTS.md
          git diff --cached --quiet && echo "No change to commit." || (git commit -m "docs: update eval results [skip ci]" && git push)
